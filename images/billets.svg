<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="noteBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171a"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="noteMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef2d43"/>
      <stop offset="100%" stop-color="#a10e21"/>
    </linearGradient>
    <linearGradient id="noteFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4485d"/>
      <stop offset="100%" stop-color="#e0112b"/>
    </linearGradient>
    <filter id="noteShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#noteShadow)">
    <rect x="70" y="30" width="170" height="98" rx="12" fill="url(#noteBack)" transform="rotate(-8 155 79)"/>
    <rect x="60" y="55" width="180" height="102" rx="12" fill="url(#noteMid)" transform="rotate(-2 150 106)"/>
    <rect x="55" y="80" width="190" height="106" rx="12" fill="url(#noteFront)"/>
  </g>

  <circle cx="118" cy="133" r="34" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
  <text x="118" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#ffffff">€</text>
  <text x="180" y="140" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="rgba(255,255,255,0.92)">200€</text>
  <line x1="168" y1="98" x2="230" y2="98" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="168" y1="164" x2="230" y2="164" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
</svg>
